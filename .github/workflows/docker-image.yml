# Star Office UI - build, smoke and publish the container image (SOU-62, Phase 5).
#
# This is where the image actually gets built: the fork's worker node has no
# container runtime, so Docker runs here on GitHub's runner. Every push and every
# release tag gets the same treatment - contract test, real build, SQLite smoke,
# Postgres smoke - and only a merge to master or a `v*` tag publishes to GHCR,
# using this workflow's own GITHUB_TOKEN (packages: write). The image that is
# pushed is the image that was tested: one job, one build.
#
# No third-party actions, and no registry credentials in repo secrets: GHCR auth
# comes from the built-in token, so there is nothing to leak from a public repo.
# Dependencies come from pyproject.toml + uv.lock via uv (SOU-170); uv itself is
# bootstrapped with the runner's stock pip, pinned to one version.

name: docker-image

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/gulasz101/star-office-ui-fork

jobs:
  contract:
    name: Image contract + test suites (backend on SQLite and Postgres, renderer, reporter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway test database on an ephemeral runner, never a place for credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sou
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sou"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Container contract (Dockerfile, entrypoint.sh, .dockerignore)
        run: python3 scripts/validate_dockerfile.py

      - name: Shell syntax of the entrypoint
        run: sh -n entrypoint.sh

      - name: Install uv (SOU-170)
        # Deliberately pip from PyPI with the runner's stock python3, pinned to
        # one version: the workflow rule is no third-party actions, so no
        # astral-sh/setup-uv, and no curl|bash.
        run: python3 -m pip install --quiet --target ./ci-uv 'uv==0.13.1'

      - name: Sync the locked environment exactly like the image resolves it
        run: ./ci-uv/bin/uv sync --frozen

      - name: Backend suite (SQLite; the Postgres legs skip without TEST_POSTGRES_URL)
        run: ./ci-uv/bin/uv run pytest backend/tests -q

      - name: Backend suite, Postgres legs (TEST_POSTGRES_URL)
        env:
          TEST_POSTGRES_URL: postgresql+psycopg2://postgres@127.0.0.1:5432/sou
        # The deselected test already fails on master (SOU-298); drop the flag with its fix.
        run: >-
          ./ci-uv/bin/uv run pytest backend/tests -q
          --deselect backend/tests/test_sou_mode.py::ReadonlyEngineTest::test_postgres_read_only_guard

      - name: Renderer logic (node --test)
        # the shell expands the glob: the runner's Node may predate `node --test` globbing
        run: node --version && node --test frontend/v3/tests/*.test.mjs

      - name: Vendored OpenCode reporter (node --test, backend schema check via uv)
        working-directory: reporter/openchamber-star-office-reporter
        run: ../../ci-uv/bin/uv run --project ../.. npm test

  image:
    name: Build, smoke on SQLite + Postgres, publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway database on an ephemeral runner: this is a migration test
          # bed, never a place for credentials (same rule as scripts/dev_postgres.sh).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sou
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sou"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build --progress=plain -t "$IMAGE:ci" .

      - name: Image size
        run: docker image ls "$IMAGE:ci" --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'

      - name: Smoke on SQLite (fresh install creates and migrates backend/sou.db)
        run: |
          set -euo pipefail
          docker run -d --name sou-sqlite --network host \
            -e STAR_BACKEND_PORT=19000 \
            "$IMAGE:ci"

          echo "--- waiting for the server ---"
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:19000/health >/dev/null 2>&1 && break
            sleep 2
          done
          docker logs sou-sqlite

          echo "--- runs as the unprivileged uid, not root ---"
          docker exec sou-sqlite id

          echo "--- the Lodge (v3) is served from the copied frontend/ ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19000/)
          test "$code" = "302" || { echo "GET / -> $code (expected the redirect to /v3/)"; exit 1; }
          code=$(curl -s -o /tmp/index.html -w '%{http_code}' http://127.0.0.1:19000/v3/)
          test "$code" = "200" || { echo "GET /v3/ -> $code"; exit 1; }
          grep -qiE 'phaser|canvas' /tmp/index.html
          echo "GET / -> 302, GET /v3/ -> 200, renderer markup present ($(wc -c < /tmp/index.html) bytes)"

          echo "--- the healthcheck path answers from the database ---"
          code=$(curl -s -o /tmp/feed.json -w '%{http_code}' 'http://127.0.0.1:19000/events/recent?limit=1')
          test "$code" = "200" || { echo "GET /events/recent -> $code"; exit 1; }
          echo "GET /events/recent?limit=1 -> 200"

          echo "--- POST /events is accepted and lands in the feed ---"
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          code=$(curl -s -o /tmp/post.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"version\":1,\"agent\":\"ci-sqlite\",\"event_type\":\"state_change\",\"timestamp\":\"$now\",\"payload\":{\"state\":\"writing\",\"detail\":\"SOU-62 CI smoke\"}}" \
            http://127.0.0.1:19000/events)
          test "$code" = "201" || { echo "POST /events -> $code: $(cat /tmp/post.json)"; exit 1; }
          curl -s 'http://127.0.0.1:19000/events/recent?limit=20' | grep -q ci-sqlite
          echo "POST /events -> 201, and the row reads back from GET /events/recent"

          echo "--- entrypoint.sh migrated the schema before the server started ---"
          # The head revision is read from the IMAGE, never hard-coded here
          # (SOU-270): pinning the first migration's id is what kept this
          # workflow red for the six merges after migration 002 landed.
          head_rev=$(docker exec -w /app sou-sqlite alembic -c /app/backend/alembic.ini heads \
            | sed -n 's/^\([0-9A-Za-z_]*\) (head)$/\1/p' | head -1)
          test -n "$head_rev" || { echo "could not read the alembic head out of the image"; exit 1; }
          echo "alembic heads -> $head_rev"
          docker exec -i -w /app sou-sqlite python3 - "$head_rev" <<'PY'
          import sqlite3
          import sys
          head = sys.argv[1]
          conn = sqlite3.connect("/app/backend/sou.db")
          version = conn.execute("SELECT version_num FROM alembic_version").fetchall()
          tables = sorted(r[0] for r in conn.execute(
              "SELECT name FROM sqlite_master WHERE type='table'"))
          events = conn.execute("SELECT count(*) FROM events").fetchone()[0]
          print("backend/sou.db:", version, tables, "events:", events)
          assert version == [(head,)], version
          assert {"agents", "events", "sessions", "alembic_version"} <= set(tables), tables
          # >= 1, not >= 2: this step posts exactly one event, and migration 003
          # drops the v1 rows (and the v1 seed) that the old floor counted.
          assert events >= 1, events
          PY

          echo "--- Docker HEALTHCHECK reaches healthy (AC4: 30s interval, 3 retries) ---"
          status=""
          for _ in $(seq 1 15); do
            status=$(docker inspect -f '{{.State.Health.Status}}' sou-sqlite)
            [ "$status" = "healthy" ] && break
            sleep 10
          done
          echo "health status: $status"
          test "$status" = "healthy"
          docker inspect -f '{{json .Config.Healthcheck}}' sou-sqlite
          docker rm -f sou-sqlite

      - name: Smoke on Postgres via DATABASE_URL (ADR-034 primary backend)
        run: |
          set -euo pipefail
          URL='postgresql+psycopg2://postgres@127.0.0.1:5432/sou'
          # psql speaks the plain libpq URL; the +psycopg2 dialect is SQLAlchemy's.
          PSQL_URL='postgresql://postgres@127.0.0.1:5432/sou'
          docker run -d --name sou-pg --network host \
            -e DATABASE_URL="$URL" \
            -e STAR_BACKEND_PORT=19001 \
            "$IMAGE:ci"

          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:19001/health >/dev/null 2>&1 && break
            sleep 2
          done
          docker logs sou-pg

          # SOU-226: `/` is a 302 to /v3/ on every face that registers it.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19001/)
          test "$code" = "302" || { echo "GET / -> $code (expected the redirect to /v3/)"; exit 1; }
          code=$(curl -s -o /tmp/index-pg.html -w '%{http_code}' http://127.0.0.1:19001/v3/)
          test "$code" = "200" || { echo "GET /v3/ -> $code"; exit 1; }
          echo "GET / -> 302, GET /v3/ -> 200 ($(wc -c < /tmp/index-pg.html) bytes)"
          code=$(curl -s -o /tmp/feed-pg.json -w '%{http_code}' 'http://127.0.0.1:19001/events/recent?limit=1')
          test "$code" = "200" || { echo "GET /events/recent -> $code"; exit 1; }

          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          code=$(curl -s -o /tmp/post-pg.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"version\":1,\"agent\":\"ci-postgres\",\"event_type\":\"state_change\",\"timestamp\":\"$now\",\"payload\":{\"state\":\"writing\",\"detail\":\"SOU-62 CI smoke\"}}" \
            http://127.0.0.1:19001/events)
          test "$code" = "201" || { echo "POST /events -> $code: $(cat /tmp/post-pg.json)"; exit 1; }
          curl -s 'http://127.0.0.1:19001/events/recent?limit=20' | grep -q ci-postgres
          echo "Postgres leg: / -> 302, /v3/ 200, feed 200, POST /events 201 (STAR_BACKEND_PORT=19001 honoured)"

          echo "--- plant the marker the public face must never serve (SOU-270) ---"
          # `session_start` is one of the few event types whose ingest allow-list
          # keeps `cwd` (backend/sanitize.py), so this is a real path arriving at
          # the door. The public-face step below asserts the Lodge never serves
          # it: that check is vacuous unless something planted it first.
          code=$(curl -s -o /tmp/post-marker.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"version\":1,\"agent\":\"ci-postgres\",\"event_type\":\"session_start\",\"timestamp\":\"$now\",\"payload\":{\"cwd\":\"/home/ci-postgres-secret-path/x\",\"source\":\"ci\"}}" \
            http://127.0.0.1:19001/events)
          test "$code" = "201" || { echo "POST /events (marker) -> $code: $(cat /tmp/post-marker.json)"; exit 1; }
          curl -s 'http://127.0.0.1:19001/events/recent?limit=20' | grep -q session_start
          echo "planted /home/ci-postgres-secret-path/x via session_start -> 201, read back from the feed"

          echo "--- head is stamped in Postgres, and no SQLite file was created ---"
          docker run --rm --network host postgres:16 \
            psql "$PSQL_URL" -v ON_ERROR_STOP=1 -Atc \
            "SELECT version_num FROM alembic_version; SELECT count(*) FROM events;"
          docker run --rm --network host postgres:16 \
            psql "$PSQL_URL" -v ON_ERROR_STOP=1 -Atc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'
              AND table_name IN ('agents','events','sessions','alembic_version');" | grep -q '^4$'
          if docker exec sou-pg test -e /app/backend/sou.db; then
            echo "FAIL: DATABASE_URL was set but the SQLite fallback file exists"
            exit 1
          fi
          echo "verified: alembic_version in Postgres, /app/backend/sou.db absent"

          echo "--- and the healthcheck goes healthy on Postgres too ---"
          status=""
          for _ in $(seq 1 15); do
            status=$(docker inspect -f '{{.State.Health.Status}}' sou-pg)
            [ "$status" = "healthy" ] && break
            sleep 10
          done
          echo "health status: $status"
          test "$status" = "healthy"
          docker rm -f sou-pg

      - name: Smoke the public face on Postgres (SOU_MODE=public, SOU_MIGRATE=0)
        run: |
          set -euo pipefail
          # Same Postgres the step above migrated; the public container must NOT
          # migrate it again (SOU_MIGRATE=0) and must not register a write door.
          URL='postgresql+psycopg2://postgres@127.0.0.1:5432/sou'
          docker run -d --name sou-public --network host \
            -e DATABASE_URL="$URL" \
            -e SOU_MODE=public \
            -e SOU_MIGRATE=0 \
            -e STAR_BACKEND_PORT=19002 \
            "$IMAGE:ci"

          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:19002/health >/dev/null 2>&1 && break
            sleep 2
          done
          docker logs sou-public

          echo "--- /health answers on the public face (the image's own probe path) ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19002/health)
          test "$code" = "200" || { echo "GET /health -> $code"; exit 1; }
          echo "GET /health -> 200"

          echo "--- the Lodge renders on the public face ---"
          code=$(curl -s -o /tmp/index-public.html -w '%{http_code}' http://127.0.0.1:19002/v3/)
          test "$code" = "200" || { echo "GET /v3/ -> $code"; exit 1; }
          grep -qiE 'phaser|canvas' /tmp/index-public.html
          echo "GET /v3/ -> 200, renderer markup present ($(wc -c < /tmp/index-public.html) bytes)"

          echo "--- /public/feed answers, and never serves the planted cwd path ---"
          code=$(curl -s -o /tmp/public-feed.json -w '%{http_code}' \
            'http://127.0.0.1:19002/public/feed?limit=50')
          test "$code" = "200" || { echo "GET /public/feed -> $code"; exit 1; }
          # Not vacuous: the marker's own agent has to be in this body.
          grep -q ci-postgres /tmp/public-feed.json
          if grep -q 'ci-postgres-secret-path' /tmp/public-feed.json; then
            echo "FAIL: the public feed served the planted path"
            cat /tmp/public-feed.json
            exit 1
          fi
          echo "GET /public/feed -> 200 ($(wc -c < /tmp/public-feed.json) bytes), ci-postgres present, no ci-postgres-secret-path"

          echo "--- the ingest door and the debug read do not exist on this face ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:19002/events/recent')
          test "$code" = "404" || { echo "GET /events/recent -> $code (expected 404)"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:19002/events)
          case "$code" in
            404|405) ;;
            *) echo "POST /events -> $code (expected 404 or 405)"; exit 1 ;;
          esac
          echo "GET /events/recent -> 404, POST /events -> $code"

          echo "--- SOU_MIGRATE=0: this container never ran a migration ---"
          # read the logs once: `docker logs | grep -q` under pipefail dies of SIGPIPE (141)
          # when grep quits early on a match
          public_logs=$(docker logs sou-public 2>&1)
          if grep -q 'alembic upgrade head' <<<"$public_logs"; then
            echo "FAIL: the public container ran migrations; SOU_MIGRATE=0 was ignored"
            exit 1
          fi
          grep -q 'SOU_MIGRATE=0: skipping migrations' <<<"$public_logs"
          echo "no 'alembic upgrade head' in the logs, and the skip notice is there"
          docker rm -f sou-public

      - name: Publish to GHCR (master pushes and v* tags only)
        if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          # SOU-270: Flux cannot order `:latest`, so a master push publishes a
          # sortable tag next to it — `master-<sha7>-<epoch>`, the shape the
          # ImagePolicy in docs/public-lodge.md sorts numerically. The epoch is
          # read ONCE here, in this step: a tag recomputed in another step would
          # name a different image and never be found in the registry.
          TAGS="latest"
          case "$GITHUB_REF" in
            refs/heads/master)
              TAGS="latest master-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)-$(date +%s)"
              ;;
            refs/tags/v*)
              TAGS="latest $GITHUB_REF_NAME"
              ;;
          esac

          for tag in $TAGS; do
            docker tag "$IMAGE:ci" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
            echo "pushed $IMAGE:$tag"
          done

          {
            echo "## Published image"
            echo
            echo "- built from \`$GITHUB_REF\` @ \`$GITHUB_SHA\`"
            echo "- tags pushed: $TAGS"
            for tag in $TAGS; do
              echo "- local digest of \`$tag\`: $(docker image inspect --format '{{join .RepoDigests " "}}' "$IMAGE:$tag")"
            done
            docker image ls "$IMAGE" --format '- image: {{.Repository}}:{{.Tag}} {{.Size}}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read the published digests back from the registry
        if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          set -euo pipefail
          TAGS="latest"
          case "$GITHUB_REF" in
            refs/tags/v*) TAGS="latest $GITHUB_REF_NAME" ;;
          esac
          for tag in $TAGS; do
            token=$(curl -s "https://ghcr.io/token?scope=repository:gulasz101/star-office-ui-fork:pull" | jq -r .token)
            digest=$(curl -s -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              -o /dev/null -D - \
              "https://ghcr.io/v2/gulasz101/star-office-ui-fork/manifests/$tag" \
              | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}')
            echo "ghcr.io/gulasz101/star-office-ui-fork:$tag -> ${digest:-MISSING}"
            test -n "$digest"
            echo "- registry confirms \`$tag\` at \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          done
