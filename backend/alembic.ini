# Alembic configuration for the SOU database layer (ADR-034).
#
# Backend selection happens in migrations/env.py: DATABASE_URL wins, the
# sqlalchemy.url below is the SQLite fallback for local development.
#
#   alembic upgrade head                                   # apply schema
#   alembic downgrade base                                 # drop it again
#   alembic upgrade head --sql                             # print DDL, no connect
#   DATABASE_URL=postgresql+psycopg2://sou@127.0.0.1:55432/sou alembic upgrade head
#
# Runtime dependencies of this directory are deliberately NOT in
# backend/requirements.txt yet (owned by SOU-18): alembic>=1.13,
# SQLAlchemy>=2.0, psycopg2-binary (Postgres only).

[alembic]
# Relative to this file, so `alembic` can be run from backend/ or from the repo root.
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# SQLite fallback (ADR-034). A relative path is resolved against the backend/
# directory by env.py, so the file never depends on the current directory.
sqlalchemy.url = sqlite:///sou.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
