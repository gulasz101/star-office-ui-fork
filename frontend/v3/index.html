<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Office v3</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14161f; overflow: hidden; }
    #game { width: 100vw; height: 100vh; }
    #caption { position: fixed; left: 0; right: 0; top: 18px; text-align: center; font: 14px monospace;
      color: #f4ead2; text-shadow: 0 0 6px #000, 0 1px 0 #000; letter-spacing: 1px; pointer-events: none;
      opacity: 0; transition: opacity 1.2s; }
    #card { position: fixed; right: 14px; top: 14px; width: 330px; max-width: calc(100vw - 28px);
      background: #2a1c12ee; border: 3px solid #6b4428; box-shadow: 0 0 0 2px #120a06, 0 6px 24px #0008;
      color: #f4ead2; font: 11px/1.45 monospace; padding: 10px 12px; pointer-events: none;
      opacity: 0; transform: translateY(-6px); transition: opacity .25s, transform .25s; }
    #card.open { opacity: 1; transform: none; }
    .card-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #6b4428;
      padding-bottom: 5px; margin-bottom: 6px; }
    .card-name { font-size: 14px; color: #ffcf7a; }
    .card-room { color: #c9a77c; }
    .card-label, .card-seen, .card-hint, .card-time, .card-empty { color: #a88d6c; }
    .card-now { margin-bottom: 2px; }
    .card-events { list-style: none; margin: 8px 0 6px; padding: 0; }
    .card-events li { display: grid; grid-template-columns: 62px 96px 1fr; gap: 6px; white-space: nowrap; overflow: hidden; }
    .card-type { color: #7fd8c0; overflow: hidden; text-overflow: ellipsis; }
    .card-what { overflow: hidden; text-overflow: ellipsis; }
    .card-hint { border-top: 1px solid #6b4428; padding-top: 5px; font-size: 10px; }
    #roster { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; display: flex; gap: 6px;
      flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 24px); }
    .chip { display: flex; align-items: center; gap: 6px; padding: 4px 9px 4px 6px; cursor: pointer;
      background: #2a1c12e6; border: 2px solid #6b4428; color: #f4ead2; font: 11px monospace;
      box-shadow: 0 0 0 1px #120a06; }
    .chip:hover { border-color: #b8864e; }
    .chip.focused { border-color: #ffcf7a; background: #3a2616f0; }
    .chip .swatch { width: 10px; height: 10px; box-shadow: 0 0 0 1px #120a06; }
    .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: #a88d6c; }
    .chip[data-status="working"] .dot { background: #7cff6a; box-shadow: 0 0 6px #7cff6a; }
    .chip[data-status="idle"] .dot { background: #ffb35a; }
    .chip[data-status="asleep"] .dot { background: #6a7fb8; }
    #hud { position: fixed; left: 8px; bottom: 6px; font: 11px monospace; color: #8a8fa3; pointer-events: none; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="caption"></div>
  <div id="card"></div>
  <div id="roster"></div>
  <div id="hud">v3 · <span id="status">starting…</span> · drag/WASD pan · wheel/± zoom · click a room · F next room · Esc overview · G grid</div>
  <script>
    // a touchpad pinch arrives as ctrl+wheel: keep it for the camera, not the browser's page zoom
    window.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  </script>
  <script src="vendor/phaser-4.2.1.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
